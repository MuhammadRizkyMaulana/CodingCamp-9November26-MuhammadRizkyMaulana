<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Expense &amp; Budget Visualizer</h1>
      <button id="theme-toggle" type="button">🌙 Dark Mode</button>
    </header>

    <section class="card balance" aria-labelledby="balance-title">
      <h2 id="balance-title">TOTAL BALANCE</h2>
      <p id="total-balance" class="balance-amount">$0.00</p>
    </section>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Add Transaction</h2>
      <form id="transaction-form" novalidate>
        <label for="item-name">Item Name</label>
        <input type="text" id="item-name">

        <label for="amount">Amount</label>
        <input type="number" id="amount" min="0.01" step="0.01" placeholder="$ 0.00">

        <label for="category">Category</label>
        <select id="category">
          <option value="">Select category</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Fun">Fun</option>
        </select>

        <p id="form-error" class="error" role="alert" hidden></p>
        <button type="submit" class="btn-primary">Add Transaction</button>
      </form>
    </section>

    <section class="grid">
      <section class="card" aria-labelledby="list-title">
        <header class="list-header">
          <h2 id="list-title">Transactions</h2>
          <label class="sr-only" for="sort-select">Sort by</label>
          <select id="sort-select">
            <option value="newest">Newest</option>
            <option value="amount-desc">Amount (high → low)</option>
            <option value="amount-asc">Amount (low → high)</option>
            <option value="category">Category (A-Z)</option>
          </select>
        </header>
        <ul id="transaction-list" class="transaction-list"></ul>
        <p id="empty-message" class="empty">No transactions yet.</p>
      </section>

      <section class="card" aria-labelledby="chart-title">
        <h2 id="chart-title">Spending by Category</h2>
        <figure class="chart-box">
          <canvas id="spending-chart" aria-label="Pie chart of spending by category" role="img"></canvas>
        </figure>
      </section>
    </section><br>

    <section class="card summary" aria-labelledby="summary-title">
      <h2 id="summary-title">Monthly Summary</h2>
      <ul id="monthly-list" class="monthly-list"></ul>
      <p id="monthly-empty" class="empty">No data yet.</p>
    </section>
  </main>
</body>
</html>
